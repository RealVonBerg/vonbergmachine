name: Build VONBERGMACHINE

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/VONBERGMACHINE_artefacts/Release/VST3/VONBERGMACHINE.vst3" dist/
          Copy-Item "build/VONBERGMACHINE_artefacts/Release/Standalone/VONBERGMACHINE.exe" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: VONBERGMACHINE-Windows-VST3
          path: dist
